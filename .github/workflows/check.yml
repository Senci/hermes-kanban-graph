name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Backend and snapshot tests (stdlib)
        run: python -m unittest discover -s tests -v
      - name: Layout tests (node, no dependencies)
        run: node tests/layout.test.mjs
      - name: Desktop half parses
        run: node --check desktop/plugin.js

  rebuild:
    # desktop/plugin.js must be exactly what the pinned esbuild builds from desktop/src.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Rebuild desktop/plugin.js (esbuild 0.28.2)
        run: sh scripts/rebuild.sh
      - name: Committed bundle equals the rebuild
        run: git diff --exit-code -- desktop/plugin.js

  hermes-validate:
    # The same check the plugin catalog runs at admission, against the oldest supported Hermes.
    runs-on: ubuntu-latest
    env:
      HERMES_REF: v2026.9.24 # Hermes 0.21.5, matches requires_hermes in plugin.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Hermes
        run: pip install -e ./hermes-agent
      - name: hermes plugins validate
        run: hermes plugins validate plugin
      - name: hermes plugins doctor
        run: hermes plugins doctor --ci plugin
