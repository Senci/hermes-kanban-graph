<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ - kanban graph</title>
<style>
:root{--bg:#141417;--panel:#1c1c21;--card:#232329;--line:#34343c;--fg:#e8e8ec;--mute:#9a9aa6;--acc:#a78bfa;
--triage:#9ca3af;--todo:#94a3b8;--scheduled:#60a5fa;--ready:#38bdf8;--running:#a78bfa;--blocked:#f87171;--review:#fbbf24;--done:#34d399;--archived:#6b7280}
@media (prefers-color-scheme:light){:root{--bg:#f6f6f8;--panel:#fff;--card:#fff;--line:#d9d9e0;--fg:#1d1d22;--mute:#6b6b76;--acc:#7c3aed;
--triage:#6b7280;--todo:#64748b;--scheduled:#2563eb;--ready:#0284c7;--running:#7c3aed;--blocked:#dc2626;--review:#b45309;--done:#059669;--archived:#9ca3af}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}
#bar,#foot{position:absolute;left:0;right:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 10px;z-index:3;
  background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px)}
#bar{top:0;border-bottom:1px solid var(--line)}
#foot{bottom:0;border-top:1px solid var(--line);padding:5px 10px}
#bar h1{font-size:13.5px;margin:0 8px 0 2px;display:flex;gap:7px;align-items:center;white-space:nowrap;font-weight:600}
#bar h1 svg{color:var(--acc)}
.field{display:inline-flex;align-items:center;gap:5px;height:28px;background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:0 8px;transition:border-color .15s}
.field:focus-within,.field:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.field input,.field select{background:none;border:0;outline:0;color:var(--fg);font:inherit;padding:0;height:100%}
.field select{cursor:pointer;padding-right:2px}.field select option{background:var(--panel)}
.field input{width:170px}
.btn,.chip{display:inline-flex;gap:5px;align-items:center;justify-content:center;height:28px;min-width:28px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:0 7px;cursor:pointer;font:inherit;user-select:none;transition:border-color .15s,opacity .15s,background .15s}
.btn:hover,.chip:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.btns{display:inline-flex}.btns .btn{border-radius:0;margin-left:-1px}.btns .btn:first-child{border-radius:7px 0 0 7px;margin:0}.btns .btn:last-child{border-radius:0 7px 7px 0}
.chip{height:24px;padding:0 7px 0 6px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.chip svg{color:var(--c)}
.chip.off{opacity:.35;background:var(--card);border-color:var(--line);filter:grayscale(1)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.sp{flex:1}
#stage{position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#hint{color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 200px;text-align:right}
.band rect{fill:color-mix(in srgb,var(--panel) 45%,transparent);stroke:var(--line)}
.band text{fill:var(--mute);font-weight:600;font-size:15px}
.band text.sub{font-weight:400;opacity:.8}
.edge{fill:none;stroke:color-mix(in srgb,var(--mute) 45%,transparent);stroke-width:1.5}
.edge.hl{stroke:var(--acc);stroke-width:2.4}
.node rect.box{fill:var(--card);stroke:var(--line);stroke-width:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.node{cursor:pointer}
.node:hover rect.box{stroke:color-mix(in srgb,var(--acc) 70%,var(--line))}
.node rect.stripe{rx:0}
.node text.t{fill:var(--fg);font-size:12.5px;font-weight:600}
.node text.s{fill:var(--mute);font-size:11px}
.node.sel rect.box{stroke:var(--acc);stroke-width:3}
.node.rel rect.box{stroke:var(--acc);stroke-width:1.8}
.dim{opacity:.16}
.hide{display:none}
.node,.edge,.band{transition:opacity .25s}
.node.gone,.edge.gone,.band.gone{opacity:0;pointer-events:none}
#world.anim,#world.anim .node,#world.anim .band{transition:transform .35s ease,opacity .25s}
#world.anim .band rect{transition:width .35s ease,height .35s ease}
#world.anim .edge{transition:d .35s ease,opacity .25s}
@media (prefers-reduced-motion:reduce){#world.anim,#world.anim *{transition:none!important}}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:4;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .15s}
#panel.open{transform:none}
#panel header{display:flex;gap:6px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--line)}
#panel header h2{font-size:14px;margin:0;flex:1;word-break:break-word}
#pbody{overflow:auto;padding:10px 12px 20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-bottom:10px}
.kv span:nth-child(odd){color:var(--mute)}
.pill{display:inline-flex;gap:4px;align-items:center;border:1px solid currentColor;border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;font:11.5px/1.45 ui-monospace,monospace;margin:4px 0 10px}
table.runs{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 10px}table.runs td{padding:2px 6px 2px 0;vertical-align:top;border-top:1px solid var(--line)}
.acts{font:11px/1.4 ui-monospace,monospace;margin:4px 0 10px}.acts div{display:grid;grid-template-columns:52px 88px 1fr;gap:6px;padding:2px 0;border-top:1px solid var(--line)}.acts b{font-weight:600;color:var(--running)}.acts span:last-child{word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node rect.arc{fill:none;stroke:var(--running);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:0 12 14 74;animation:arc 2.2s linear infinite;pointer-events:none;filter:drop-shadow(0 0 3px var(--running))}
.node rect.arc.stale{stroke:var(--review);animation-duration:6s}
@keyframes arc{to{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.node rect.arc{animation:none}}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:12px 0 4px}
.rl{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.rl:hover{background:var(--card)}
.rl small{color:var(--mute);margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
<div id="bar">
  <h1><span data-i="layout-kanban"></span><span id="ttl"></span></h1>
  <label class="field" title="Search (/)"><span data-i="search"></span><input id="q" type="search" placeholder="Search id, title, assignee" autocomplete="off"></label>
  <label class="field" id="boardf" title="Jump to board"><span data-i="world"></span><select id="board"></select></label>
  <label class="field" title="Arrange"><span data-i="sitemap"></span><select id="mode"></select></label>
  <span class="sp"></span>
  <span class="btns"><button class="btn" id="zout" title="Zoom out (-)"><span data-i="zoom-out"></span></button><button class="btn" id="fit" title="Fit (0)"><span data-i="focus-centered"></span></button><button class="btn" id="zin" title="Zoom in (+)"><span data-i="zoom-in"></span></button></span>
</div>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="bands"></g><g id="edges"></g><g id="nodes"></g></g></svg>
<div id="foot"><span id="chips" style="display:contents"></span><span id="hint"></span></div>
<aside id="panel"><header><h2 id="ptitle"></h2><button class="btn" id="pclose" title="Close (Esc)"><span data-i="x"></span></button></header><div id="pbody"></div></aside>
<script>
window.onerror=(m,src,l)=>{document.getElementById('hint').textContent='Render error: '+m+' (line '+l+')'};
const D=__DATA__, IC=__ICONS__;
const SI={triage:'circle-dashed',todo:'circle',scheduled:'calendar-time',ready:'circle-dot',running:'player-play',blocked:'lock',review:'eye',done:'circle-check',archived:'archive'};
const NS='http://www.w3.org/2000/svg', [NW,NH]=D.node, $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${IC[n]||''}</svg>`;
const col=s=>`var(--${s})`;
const fmt=t=>t?new Date(t*1000).toLocaleString([], {dateStyle:'short',timeStyle:'short'}):'';
const dur=s=>{s=Math.max(0,Math.round(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`};
const hm=t=>new Date(t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
// Wall clock for running timers; the data itself is frozen at D.generated (a finished run keeps
// counting until the page is re-rendered, which the footer's snapshot age makes visible).
const now=()=>Date.now()/1000;
const curRun=t=>(t.runs||[]).find(u=>u.s==='running');
document.querySelectorAll('[data-i]').forEach(e=>e.outerHTML=icon(e.dataset.i));
$('#ttl').textContent=D.title;
const byK=new Map(D.tasks.map(t=>[t.k,t])), up=new Map(), down=new Map();
D.tasks.forEach(t=>{up.set(t.k,[]);down.set(t.k,[])});
D.links.forEach(([p,c])=>{down.get(p).push(c);up.get(c).push(p)});

/*__LAYOUT__*/

// Bands, edges, nodes
const bands=$('#bands'), edges=$('#edges'), nodes=$('#nodes'), stage=$('#stage'), world=$('#world');
const BG=new Map();
D.boards.forEach(b=>{
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','band'); g.dataset.slug=b.slug;
  g.innerHTML=`<rect x="-24" y="-8" rx="12"/><svg class="bh" x="0" y="-8" height="${BAND_HEAD+8}"><text class="ttl">${esc(b.name)}</text><text class="sub"></text></svg>`;
  bands.appendChild(g); BG.set(b.slug,g);
  $('#board').insertAdjacentHTML('beforeend',`<option value="${esc(b.slug)}">${esc(b.name)} (${b.n})</option>`);
});
if(D.boards.length<2) $('#boardf').classList.add('hide'); else $('#board').insertAdjacentHTML('afterbegin','<option value="" selected>All boards</option>');
const E=D.links.map(([p,c])=>{
  const el=document.createElementNS(NS,'path'); el.setAttribute('class','edge');
  el.setAttribute('marker-end','url(#ah)'); edges.appendChild(el); return {p,c,el};
});
$('#stage').insertAdjacentHTML('afterbegin','<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mute)"/></marker></defs>');
// Running tasks get a highlight travelling the border, like the app's kanban cards; a heartbeat
// older than 2 min (as of render time) turns it amber and slow.
const arcSvg=t=>{const r=curRun(t); if(!r) return ''; const hb=r.hb||t.hb, stale=hb&&D.generated-hb>120;
  return `<rect class="arc${stale?' stale':''}" width="${NW}" height="${NH}" rx="8" pathLength="100"/>`};
const cut=(s,n)=>s.length>n?s.slice(0,n-1).trimEnd()+'.':s;
const N=new Map();
D.tasks.forEach(t=>{
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','node');
  const warn=t.f>0||t.bk?`<svg x="${NW-22}" y="6" width="15" height="15" viewBox="0 0 24 24" style="color:var(--blocked)">${IC['alert-triangle']}</svg>`:'';
  g.innerHTML=`<title>${esc(t.t)}</title><rect class="box" width="${NW}" height="${NH}" rx="8"/><rect class="stripe" width="4" height="${NH-12}" x="0" y="6" fill="${col(t.s)}"/>`+
    `<svg x="12" y="9" width="16" height="16" viewBox="0 0 24 24" style="color:${col(t.s)}">${IC[SI[t.s]]||''}</svg>`+
    `<text class="t" x="34" y="22">${esc(cut(t.t,warn?26:29))}</text>`+
    (curRun(t)?`<text class="s live-t" x="12" y="44" style="fill:var(--running)" data-a="${curRun(t).a}"></text>`
      :`<text class="s" x="12" y="44">${esc(t.id)}${t.a?' · '+esc(t.a):''}${t.m?' · '+esc(cut(t.m.replace('claude-',''),14)):''}</text>`)+warn+arcSvg(t);
  if(curRun(t)) g.classList.add('live');
  g.addEventListener('click',ev=>{ev.stopPropagation(); select(t.k)});
  nodes.appendChild(g); N.set(t.k,g);
});

// Layout: rerun over the visible tasks whenever the visible set changes, so hidden tasks leave no
// holes and their links stop shaping the graph. kanban_graph.py pastes the live plugin's layout
// code here, so both views arrange tasks the same way.
// Arrange mode, remembered per browser; changing it re-lays out and refits.
let MODE=localStorage.getItem('kg-mode')||'flow'; if(!KG_MODES.some(([m])=>m===MODE)) MODE='flow';
KG_MODES.forEach(([m,l])=>$('#mode').insertAdjacentHTML('beforeend',`<option value="${m}"${m===MODE?' selected':''}>${l}</option>`));
$('#mode').addEventListener('change',e=>{MODE=e.target.value; localStorage.setItem('kg-mode',MODE); laySig=''; userMoved=false; paint(); if(!sel) fit()});
const layoutAll=shown=>{const r=stage.getBoundingClientRect(); return kgLayout(D,shown,r.height>0?r.width/r.height:1.6,MODE)};
let LAY=null, laySig='';
// Apply a layout; visible elements keep their last place while hidden, so a re-show slides from there.
function place(lay){
  lay.pos.forEach(([x,y],k)=>{N.get(k).style.transform=`translate(${x}px,${y}px)`});
  E.forEach(e=>{const d=lay.routes.get(`${e.p}>${e.c}`); if(d){e.el.setAttribute('d',d); e.el.style.d=`path("${d}")`}});
  const LB=new Map(lay.bands.map(b=>[b.slug,b]));
  D.boards.forEach(b=>{
    const g=BG.get(b.slug), L=LB.get(b.slug);
    g.classList.toggle('gone',!L); if(!L) return;
    g.style.transform=`translate(${L.x}px,${L.y}px)`;
    const r=g.querySelector('rect'); r.style.width=`${L.w+48}px`; r.style.height=`${L.h+16}px`;
    const cnt=D.statuses.filter(s=>b.counts[s]).map(s=>`${b.counts[s]} ${s}`).join(' · ');
    g.querySelector('.bh').setAttribute('width',Math.max(1,L.w));
    g.querySelector('.sub').textContent=[b.slug,`${L.shown===b.n?b.n:L.shown+'/'+b.n} tasks`,cnt].filter(Boolean).join(' · ');
  });
}

// Filters
const off=new Set();
const present=D.statuses.filter(s=>D.tasks.some(t=>t.s===s));
present.forEach(s=>{
  const n=D.tasks.filter(t=>t.s===s).length;
  $('#chips').insertAdjacentHTML('beforeend',`<span class="chip" data-s="${s}" style="--c:${col(s)}" title="${s} (${n}). Click: toggle. Shift+click: show only ${s} (again: show all)">${icon(SI[s])}<b>${n}</b></span>`);
});
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return; const s=c.dataset.s;
  if(e.shiftKey){ // solo: only this status on; shift-click the solo chip again to show all
    const solo=!off.has(s)&&present.every(x=>x===s||off.has(x));
    off.clear(); if(!solo) present.forEach(x=>{if(x!==s) off.add(x)});
  } else off.has(s)?off.delete(s):off.add(s);
  document.querySelectorAll('#chips .chip').forEach(ch=>ch.classList.toggle('off',off.has(ch.dataset.s)));
  paint();
});
$('#chips').addEventListener('mousedown',e=>{if(e.shiftKey) e.preventDefault()});
let qT=0; $('#q').addEventListener('input',()=>{clearTimeout(qT); qT=setTimeout(paint,150)});
function visible(t){
  if(off.has(t.s)) return false;
  const q=$('#q').value.trim().toLowerCase();
  return !q||[t.id,t.t,t.a,t.b,t.m].some(v=>String(v).toLowerCase().includes(q));
}

// Selection = the task plus every ancestor and descendant (transitive)
let sel=null, rel=new Set();
function walk(k,map,acc){for(const n of map.get(k)){if(!acc.has(n)){acc.add(n);walk(n,map,acc)}}return acc}
function select(k){
  if(sel===k){clear();return}
  sel=k; const A=walk(k,up,new Set()), B=walk(k,down,new Set()); rel=new Set([...A,...B]);
  paint(); panel(k,A,B);
}
function clear(){sel=null; rel=new Set(); $('#panel').classList.remove('open'); paint()}
function paint(){
  const any=sel!==null;
  const shownSet=new Set(D.tasks.filter(t=>visible(t)||t.k===sel||rel.has(t.k)).map(t=>t.k)), shown=shownSet.size;
  const sig=[...shownSet].join('\n');
  if(sig!==laySig){
    const prev=LAY; laySig=sig; LAY=layoutAll(shownSet);
    if(!prev){place(LAY)} else {
      world.classList.add('anim'); clearTimeout(animT); animT=setTimeout(()=>world.classList.remove('anim'),400);
      place(LAY);
      // Camera: the selected task holds its screen position; with no selection, refit to the new set.
      const a=sel&&prev.pos.get(sel)&&LAY.pos.get(sel);
      if(a){const [ox,oy]=prev.pos.get(sel), [nx,ny]=LAY.pos.get(sel); vx+=(ox-nx)*vs; vy+=(oy-ny)*vs; apply()}
      else fit();
    }
  }
  D.tasks.forEach(t=>{
    const g=N.get(t.k), v=shownSet.has(t.k);
    g.classList.toggle('gone',!v);
    g.classList.toggle('sel',t.k===sel); g.classList.toggle('rel',rel.has(t.k));
    g.classList.toggle('dim',any&&t.k!==sel&&!rel.has(t.k));
  });
  const on=k=>k===sel||rel.has(k);
  E.forEach(e=>{
    const v=shownSet.has(e.p)&&shownSet.has(e.c)&&LAY.routes.has(`${e.p}>${e.c}`);
    const h=any&&on(e.p)&&on(e.c); e.el.classList.toggle('gone',!v||(LAY.quiet&&!h));
    e.el.classList.toggle('hl',h); e.el.classList.toggle('dim',any&&!h);
  });
  $('#hint').innerHTML=`${shown}/${D.tasks.length} tasks${D.hidden&&D.hidden.length?' (hidden: '+esc(D.hidden.join(', '))+')':''}${LAY.implied?', '+LAY.implied+' implied links hidden':''}${LAY.quiet&&!any?', arrows on select':''}  ·  snapshot ${fmt(D.generated)} <span class="age" data-a="${D.generated}"></span>`;
  $('#hint').title='Drag to pan, wheel to zoom, click a task to select everything linked to it, Esc to clear. Statuses do not update; re-render for fresh data.';
}
function row(k){const t=byK.get(k);return `<div class="rl" data-k="${esc(k)}"><span style="color:${col(t.s)};display:inline-flex">${icon(SI[t.s])}</span><span>${esc(t.t)}</span><small>${esc(t.id)}</small></div>`}
function panel(k,A,B){
  const t=byK.get(k);
  $('#ptitle').textContent=t.t;
  const kv=[['Status',`<span class="pill" style="color:${col(t.s)}">${icon(SI[t.s])}${t.s}</span>${t.bk?' <small>('+esc(t.bk)+')</small>':''}`],
    ['Id',esc(t.id)],['Board',esc(t.b)],['Assignee',esc(t.a)],['Model',esc([t.m,t.e].filter(Boolean).join(' / '))],
    ['Priority',t.p||''],['Created',fmt(t.c)],['Started',fmt(t.st)],['Completed',fmt(t.d)],['Failures',t.f||'']]
    .filter(([,v])=>v!==''&&v!==0).map(([a,v])=>`<span>${a}</span><span>${v}</span>`).join('');
  let h=`<div class="kv">${kv}</div>`;
  const sortK=s=>[...s].sort((a,b)=>byK.get(a).c-byK.get(b).c);
  if(A.size) h+=`<h3>Upstream (${A.size})</h3>`+sortK(A).map(row).join('');
  if(B.size) h+=`<h3>Downstream (${B.size})</h3>`+sortK(B).map(row).join('');
  if(!A.size&&!B.size) h+=`<h3>Linked tasks</h3><div style="color:var(--mute)">None${t.hx?'':': this task has no parent or child links'}.</div>`;
  if(t.hx) h+=`<div style="color:var(--mute);margin:4px 0">${t.hx.p} parent and ${t.hx.c} child links go to hidden tasks (${esc((D.hidden||[]).join(', '))}).</div>`;
  h+=runHtml(t);
  if(t.err) h+=`<h3>Last failure</h3><pre>${esc(t.err)}</pre>`;
  if(t.res) h+=`<h3>Result</h3><pre>${esc(t.res)}</pre>`;
  if(t.body) h+=`<h3>Body</h3><pre>${esc(t.body)}</pre>`;
  h+=`<h3>CLI</h3><pre>hermes kanban --board ${esc(t.b)} show ${esc(t.id)}</pre>`;
  $('#pbody').innerHTML=h; $('#pbody').scrollTop=0; $('#panel').classList.add('open'); tick();
}
function runHtml(t){
  const R=t.runs||[]; if(!R.length) return '';
  const c=curRun(t), L=t.live; let h='';
  if(c){
    const kv=[['Run',`#${c.id} on ${esc(c.pr)}`],['Running for',`<span class="tick" data-a="${c.a}"></span> (since ${fmt(c.a)})`],
      ['Heartbeat',c.hb?`<span class="tick" data-a="${c.hb}" data-sfx=" ago"></span>`:'none yet'],
      ['Runtime cap',t.mx?dur(t.mx):''],['First claimed',t.st?`${fmt(t.st)} (<span class="tick" data-a="${t.st}" data-sfx=" ago"></span>)`:'']];
    if(L&&!L.err) kv.push(['Session',esc(L.sid)],['Activity',`${L.calls} tool calls, ${L.api} API calls, ${L.msgs} msgs`],
      ['Tokens',`${(L.out/1000).toFixed(1)}k out, ${(L.cr/1e6).toFixed(2)}M cache read`],['Est. cost',L.cost!=null?'$'+Number(L.cost).toFixed(2):''],
      ['Last activity',L.last?`${esc(L.desc)} (${hm(L.last)})`:'']);
    h+=`<h3>Live run (as of ${hm(D.generated)})</h3><div class="kv">`+kv.filter(([,v])=>v).map(([a,v])=>`<span>${a}</span><span>${v}</span>`).join('')+`</div>`;
    if(L&&L.err) h+=`<pre>${esc(L.err)}</pre>`;
    if(L&&L.say) h+=`<h3>Last worker note</h3><pre>${esc(L.say)}</pre>`;
    if(L&&L.acts&&L.acts.length) h+=`<h3>Recent actions (newest first, ${L.acts.length})</h3><div class="acts">`+
      L.acts.map(([ts,n,a])=>`<div><span>${hm(ts).slice(0,5)}</span><b>${esc(n)}</b><span>${esc(a)}</span></div>`).join('')+`</div>`;
  }
  h+=`<h3>Runs (${R.length})</h3><table class="runs">`+R.slice().reverse().map(u=>
    `<tr><td>#${u.id}</td><td>${esc(u.o||u.s)}</td><td>${fmt(u.a)}</td><td>${dur((u.z||now())-u.a)}</td><td>${esc(u.e)}</td></tr>`).join('')+`</table>`;
  return h;
}
function tick(){
  const n=now();
  document.querySelectorAll('.live-t').forEach(e=>e.textContent=`running ${dur(n-+e.dataset.a)}`);
  document.querySelectorAll('#hint .age').forEach(e=>e.textContent=`(${dur(n-+e.dataset.a)} ago)`);
  document.querySelectorAll('#pbody .tick').forEach(e=>e.textContent=dur(n-+e.dataset.a)+(e.dataset.sfx||''));
}
tick(); setInterval(tick,1000);
$('#pbody').addEventListener('click',e=>{const r=e.target.closest('.rl'); if(r){focusOn(r.dataset.k); select(r.dataset.k)}});
$('#pclose').addEventListener('click',clear);

// Pan + zoom
let vx=0,vy=0,vs=1,animT=0;
const bandTtl=[...document.querySelectorAll('.band .ttl')], bandSub=[...document.querySelectorAll('.band .sub')];
// Band headers scale with zoom inside their strip (kgHeadFont); the nested svg clips them at the band's width.
const apply=()=>{world.style.transform=`translate(${vx}px,${vy}px) scale(${vs})`; const fs=kgHeadFont(vs), ss=fs*.62;
  bandTtl.forEach(t=>{t.style.fontSize=fs+'px'; t.setAttribute('y',HEAD_TOP+fs*.95)}); bandSub.forEach(t=>{t.style.fontSize=ss+'px'; t.setAttribute('y',HEAD_TOP+fs*1.2+ss*.95)})};
function zoomAt(f,cx,cy){world.classList.remove('anim'); const ns=Math.min(3,Math.max(0.05,vs*f)); vx=cx-(cx-vx)*ns/vs; vy=cy-(cy-vy)*ns/vs; vs=ns; apply()}
function fitBox(x0,y0,x1,y1){
  const r=stage.getBoundingClientRect(), top=$('#bar').offsetHeight+10, pw=$('#panel').classList.contains('open')?$('#panel').offsetWidth:0;
  const W=r.width-pw-40, H=r.height-top-$('#foot').offsetHeight-20; vs=Math.min(1.4,W/(x1-x0),H/(y1-y0));
  vx=20-x0*vs+(W-(x1-x0)*vs)/2; vy=top-y0*vs+(H-(y1-y0)*vs)/2; apply();
}
function fit(){if(LAY&&LAY.box) fitBox(...LAY.box)}
function focusOn(k){const p=LAY&&LAY.pos.get(k); if(!p) return; const r=stage.getBoundingClientRect(); vs=Math.max(vs,0.9); vx=r.width/2-(p[0]+NW/2)*vs-150; vy=r.height/2-(p[1]+NH/2)*vs; apply()}
stage.addEventListener('wheel',e=>{e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null, moved=false; const pts=new Map();
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]); if(pts.size===1){drag=[e.clientX,e.clientY,vx,vy]; moved=false}});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){
    const other=[...pts.entries()].find(([id])=>id!==e.pointerId)[1], cur=pts.get(e.pointerId);
    const d0=Math.hypot(prev[0]-other[0],prev[1]-other[1]), d=Math.hypot(cur[0]-other[0],cur[1]-other[1]);
    if(d0>0){const r=stage.getBoundingClientRect(); zoomAt(d/d0,(cur[0]+other[0])/2-r.left,(cur[1]+other[1])/2-r.top)}
    moved=true; drag=null; return}
  if(!drag) return; const dx=e.clientX-drag[0], dy=e.clientY-drag[1];
  if(!moved&&Math.hypot(dx,dy)<4) return;
  if(!moved){moved=true; world.classList.remove('anim'); stage.setPointerCapture(e.pointerId); stage.classList.add('drag')}
  vx=drag[2]+dx; vy=drag[3]+dy; apply();
});
const end=e=>{pts.delete(e.pointerId); if(pts.size===0){stage.classList.remove('drag'); drag=null}};
stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
stage.addEventListener('click',e=>{if(moved){e.stopPropagation(); moved=false; return} if(!e.target.closest('.node')) clear()},true);
$('#zin').onclick=()=>{const r=stage.getBoundingClientRect(); zoomAt(1.25,r.width/2,r.height/2)};
$('#zout').onclick=()=>{const r=stage.getBoundingClientRect(); zoomAt(0.8,r.width/2,r.height/2)};
$('#fit').onclick=fit;
$('#board').addEventListener('change',e=>{const b=LAY&&LAY.bands.find(x=>x.slug===e.target.value); userMoved=true; b?fitBox(b.x-24,b.y-8,b.x+b.w+24,b.y+b.h+8):fit()});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Escape'){e.target.value='';paint();e.target.blur()} return}
  if(e.key==='Escape') clear(); else if(e.key==='0') fit();
  else if(e.key==='+'||e.key==='='){$('#zin').click()} else if(e.key==='-'){$('#zout').click()}
  else if(e.key==='/'){e.preventDefault(); $('#q').focus()}
});
let userMoved=false;
['wheel','pointerdown'].forEach(ev=>stage.addEventListener(ev,()=>{userMoved=true},{passive:true}));
new ResizeObserver(()=>{if(!userMoved&&!sel) fit()}).observe(stage);
paint(); fit();
</script>
</body>
